name: 'ParcelVault — Selenium E2E Tests'

on:
  workflow_dispatch:

concurrency:
  group: selenium-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  selenium-e2e:
    name: 'Run Selenium E2E Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Node.js 20.x'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 'Install web app dependencies'
        run: npm install

      - name: 'Build web application'
        run: npm run build

      - name: 'Install backend dependencies'
        run: npm install
        working-directory: ./backend

      - name: 'Seed database and start backend server'
        run: |
          npm run seed
          npm start &
          echo "Waiting for backend to start..."
          for i in {1..15}; do
            if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is up!"
              break
            fi
            sleep 2
          done
        working-directory: ./backend
        env:
          PORT: 3001
          JWT_SECRET: parcelvault_super_secret_key_2026
          JWT_EXPIRES_IN: 7d
          DB_PATH: ./src/db/parcelvault.db
          NODE_ENV: development
          NODE_OPTIONS: --experimental-sqlite

      - name: 'Start Vite dev server in background'
        run: |
          npm run dev &
          echo "Waiting for Vite to start..."
          for i in {1..15}; do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite dev server is up!"
              break
            fi
            sleep 2
          done

      - name: 'Install Selenium test dependencies'
        run: npm install
        working-directory: ./selenium-tests

      - name: 'Setup Chrome for Selenium'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 'Create test-results directory'
        run: |
          mkdir -p selenium-tests/test-results
          mkdir -p android-tests/test-results

      - name: 'Run Selenium E2E Tests'
        continue-on-error: true
        run: HEADLESS=true npm run test:all || true
        working-directory: ./selenium-tests
        env:
          BASE_URL: http://localhost:5173

      - name: 'Generate Unified QA Test Reports'
        if: always()
        run: node selenium-tests/generate-reports.js || true

      - name: 'Upload test results'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-test-results
          path: |
            selenium-tests/test-results/
            android-tests/test-results/
          retention-days: 7
