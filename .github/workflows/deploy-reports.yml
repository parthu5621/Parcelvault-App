name: Deploy Test Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Android App E2E Automation & CI/CD Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages:
    name: 🌐 Deploy Historical & Latest Reports to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: automation/reports
          destination_dir: reports
